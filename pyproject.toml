[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualyrics"
version = "2.1.0"
description = "Synced song lyrics and live captions with a translation under every line, as a floating overlay for Windows (Spotify, YouTube Music, Spotube, games and films)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dualyrics contributors" }]
keywords = ["lyrics", "synced lyrics", "lyrics translation", "translate lyrics", "spotify lyrics",
            "youtube music lyrics", "lrclib", "gemini", "overlay", "windows", "karaoke", "language learning",
            "live captions", "game subtitles", "subtitle translation", "ocr", "translate game dialogue", "whisper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "requests>=2.31",
    "PySocks>=1.7.1",
    "customtkinter>=5.2",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "winrt-runtime>=2.0",
    "winrt-Windows.Foundation>=2.0",
    "winrt-Windows.Foundation.Collections>=2.0",
    "winrt-Windows.Media.Control>=2.0",
    "winrt-Windows.Media.Ocr>=2.0",
    "winrt-Windows.Graphics.Imaging>=2.0",
    "winrt-Windows.Globalization>=2.0",
    "winrt-Windows.Storage.Streams>=2.0",
    "comtypes>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Live mode (captions for what the speakers play); the app can also install these itself
live = ["numpy>=1.24", "faster-whisper>=1.0", "PyAudioWPatch>=0.2.12"]
live-gpu = ["numpy>=1.24", "faster-whisper>=1.0", "PyAudioWPatch>=0.2.12", "nvidia-cublas-cu12",
            "nvidia-cudnn-cu12>=9,<10"]

[project.gui-scripts]
dualyrics = "dualyrics.app:main"

[tool.setuptools]
packages = ["dualyrics", "dualyrics.dub", "dualyrics.live", "dualyrics.screen", "dualyrics.templates", "dualyrics.ui"]

[tool.setuptools.package-data]
dualyrics = ["assets/*", "assets/fonts/*", "assets/theme/*"]
"dualyrics.templates" = ["schema.json", "builtin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

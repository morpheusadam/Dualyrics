name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $init = Get-Content dualyrics/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') { throw "version not found" }
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($Matches[1] -ne $tag) { throw "tag v$tag does not match __version__ $($Matches[1])" }

      - name: Run tests
        run: python -m pytest -q

      - name: Build with PyInstaller and zip
        run: ./tools/build.ps1 -SkipTests

      - name: Release notes from CHANGELOG.md
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[?v?" + [regex]::Escape($version) + "\]?[^\n]*\n(.*?)(?=^## |^\[\d|\z)"
          $m = [regex]::Match($text, $pattern)
          if ($m.Success) { $notes = $m.Groups[1].Value.Trim() } else { $notes = "See CHANGELOG.md." }
          Set-Content -Path dist/RELEASE_NOTES.md -Value $notes -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Dualyrics-windows
          path: |
            dist/Dualyrics.exe
            dist/Dualyrics-*-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @("dist/Dualyrics.exe", "dist/SHA256SUMS.txt") + (Get-ChildItem dist/Dualyrics-*-windows-x64.zip).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Dualyrics $tag" --notes-file dist/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
